# Alembic owns the DOMAIN schema (application tables, columns, indexes).
# Supabase SQL migrations own RLS, storage buckets/policies and queues.
# The boundary is documented in docs/PRODUCTION_ARCHITECTURE.md; keeping it
# means there is never more than one authority for any object.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is intentionally absent: env.py reads DATABASE_URL so a
# connection string is never committed to the repository.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
